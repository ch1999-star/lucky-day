<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 한 줄</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .label {
      font-size: 0.95rem;
      opacity: 0.75;
      margin-bottom: 18px;
      letter-spacing: 0.02em;
    }

    .quote-box {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    }

    .quote {
      font-size: 1.6rem;
      line-height: 1.7;
      word-break: keep-all;
      margin-bottom: 20px;
    }

    .index {
      font-size: 0.9rem;
      opacity: 0.7;
    }

    button {
      margin-top: 24px;
      padding: 12px 20px;
      border: none;
      border-radius: 999px;
      background: white;
      color: #333;
      font-size: 0.95rem;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.92;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="label">오늘의 한 줄</div>

    <div class="quote-box">
      <div class="quote" id="quote"></div>
      <div class="index" id="index"></div>
    </div>

    <button onclick="showRandomQuote()">다른 문장 보기</button>
  </div>

  <script>
    const quotes = [
      "버티는 하루도 결국은 앞으로 가는 중이다.",
      "지금 느린 건 멈춘 게 아니라 쌓이는 과정이다.",
      "확신이 없어도 계속 가는 사람이 결국 도착한다.",
      "오늘의 선택이 내일의 나를 만든다.",
      "지나간 후회보다 아직 남은 가능성이 더 중요하다.",
      "완벽하려다 멈추지 말고, 부족해도 계속 가라.",
      "작은 반복이 결국 큰 차이를 만든다.",
      "흔들리는 건 약한 게 아니라 살아있다는 증거다.",
      "지금의 나를 견디는 것도 하나의 실력이다.",
      "늦었다고 생각할 때가 아니라, 아직 시작할 수 있는 때다.",
      "남과 비교하는 순간, 내 속도는 사라진다.",
      "불안은 방향을 잃었을 때 커진다.",
      "결국 남는 건 결과보다 그 과정에서의 태도다.",
      "지금의 선택이 쌓여 결국 인생이 된다.",
      "멈추지 않는 이상 실패는 확정되지 않는다."
    ];

    function getTodayIndex() {
      const today = new Date();
      return today.getDate() % quotes.length;
    }

    function showTodayQuote() {
      const index = getTodayIndex();
      document.getElementById("quote").innerText = quotes[index];
      document.getElementById("index").innerText = `오늘의 문장 (${index + 1}/${quotes.length})`;
    }

    function showRandomQuote() {
      const randomIndex = Math.floor(Math.random() * quotes.length);
      document.getElementById("quote").innerText = quotes[randomIndex];
      document.getElementById("index").innerText = `랜덤 문장 (${randomIndex + 1}/${quotes.length})`;
    }

    showTodayQuote();
  </script>
</body>
</html>
